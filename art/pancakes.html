<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>still warm</title>
<style>
  html, body { margin: 0; padding: 0; background: #080503; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
/* ---------------------------------------------------------------------------
   still warm - a stack of pancakes, drawn with the canvas 2D API.

   Deterministic: one fixed-seed generator, no clock, no Math.random, so this
   page draws the same picture every time it is opened. No network, no webfont,
   nothing to load.

   The picture is lit the way food is photographed: one key light from the upper
   left, a shallow focal plane (room and far table soft, the food crisp), a cast
   shadow that agrees with the key, and a different finish on every surface -
   matte plate and wood, translucent syrup, melting fat, wet fruit.

   The syrup is the part that is easy to get wrong. It is not painted as an
   opaque shape: it is laid on at less than full opacity and then deepened with
   a multiply pass, so the crumb of the pancake shows through it the way it does
   through real syrup, and its highlights are broken into pieces rather than
   running the whole length of a run - a continuous bright line down a run of
   syrup is what makes drawn syrup look like a wax rod.

   Every outline is a sum of harmonics of the angle: lumpy the way poured batter
   is lumpy, and still closing exactly.
   --------------------------------------------------------------------------- */
(function () {
  'use strict';

  var W = 1024, H = 1024;
  var cv = document.getElementById('c');
  var g = cv.getContext('2d');

  /* ------------------------------------------------------------------ random */
  var s = 0x9e3779b9;
  function seed(n) { s = (n >>> 0) || 1; for (var i = 0; i < 12; i++) rnd(); }
  function rnd() {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  }
  function rg(a, b) { return a + (b - a) * rnd(); }
  function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
  function offscreen() {
    var o = document.createElement('canvas');
    o.width = W; o.height = H;
    return o;
  }

  /* ----------------------------------------------------------------- shapes */
  function wobble(th, ph, amp) {
    return 1 + amp * (0.62 * Math.sin(th * 3 + ph)
      + 0.34 * Math.sin(th * 5 - ph * 1.7)
      + 0.20 * Math.sin(th * 8 + ph * 2.3)
      + 0.11 * Math.sin(th * 13 - ph * 0.7)
      + 0.06 * Math.sin(th * 21 + ph * 1.3));
  }
  function ring(cx, cy, rx, ry, ph, amp, n) {
    var p = [], i, th, k;
    for (i = 0; i < n; i++) {
      th = i / n * Math.PI * 2; k = wobble(th, ph, amp);
      p.push([cx + Math.cos(th) * rx * k, cy + Math.sin(th) * ry * k]);
    }
    return p;
  }
  function blob(cx, cy, r, ph, amp, n) { return ring(cx, cy, r, r, ph, amp, n); }
  function path(p, close) {
    g.beginPath();
    g.moveTo(p[0][0], p[0][1]);
    for (var i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]);
    if (close !== false) g.closePath();
  }
  function arcPath(p, f, t) {
    var n = p.length, i0 = Math.floor(f * n), i1 = Math.ceil(t * n), i, q;
    g.beginPath();
    for (i = i0; i <= i1; i++) {
      q = p[((i % n) + n) % n];
      if (i === i0) g.moveTo(q[0], q[1]); else g.lineTo(q[0], q[1]);
    }
  }
  function offsetPts(p, i0, i1, dx, dy) {
    var out = [], i;
    for (i = i0; i <= i1; i++) out.push([p[i][0] + dx, p[i][1] + dy]);
    return out;
  }
  function ribbon(pts, hw) {
    var left = [], right = [], i, p, a, b, dx, dy, L, nx, ny;
    for (i = 0; i < pts.length; i++) {
      p = pts[i];
      a = pts[Math.max(0, i - 1)]; b = pts[Math.min(pts.length - 1, i + 1)];
      dx = b[0] - a[0]; dy = b[1] - a[1]; L = Math.sqrt(dx * dx + dy * dy) || 1;
      dx /= L; dy /= L; nx = -dy; ny = dx;
      left.push([p[0] + nx * hw[i], p[1] + ny * hw[i]]);
      right.push([p[0] - nx * hw[i], p[1] - ny * hw[i]]);
    }
    return left.concat(right.reverse());
  }
  function offsetLine(pts, off, from, to, jitter) {
    var out = [], i, p, a, b, dx, dy, L, nx, ny, j;
    for (i = from; i <= to; i++) {
      p = pts[i]; a = pts[Math.max(0, i - 1)]; b = pts[Math.min(pts.length - 1, i + 1)];
      dx = b[0] - a[0]; dy = b[1] - a[1]; L = Math.sqrt(dx * dx + dy * dy) || 1;
      dx /= L; dy /= L; nx = -dy; ny = dx;
      j = jitter ? rg(-jitter, jitter) : 0;
      out.push([p[0] + nx * (off + j), p[1] + ny * (off + j)]);
    }
    return out;
  }

  /* -------------------------------------------------------------- the stack */
  // Centres sit more than a thickness apart: a pancake rests on its browned rim
  // and its domed middle holds it a little clear of the one below, which is why
  // a sliver of every top face shows and not only the bands. No two pancakes are
  // the same width and none of them is concentric with the one under it.
  var STACK = [
    { x: 520, y: 660, rx: 292, ry: 97, t: 46, ph: 1.15, amp: 0.058 },
    { x: 500, y: 602, rx: 284, ry: 93, t: 44, ph: 3.45, amp: 0.066 },
    { x: 522, y: 548, rx: 290, ry: 89, t: 42, ph: 5.95, amp: 0.052 },
    { x: 506, y: 496, rx: 270, ry: 85, t: 39, ph: 8.35, amp: 0.070 }
  ];
  var NP = 280;
  var PLATE = { x: 512, y: 690, rx: 420, ry: 188 };
  var TOP = STACK[3];

  /* --------------------------------------------------------------- the note */
  // A single-stroke hand: each glyph is SVG path data in a box whose baseline is
  // y=0 and whose x-height is y=1. Stroked with round caps, at a slight slant,
  // with a little per-letter rotation so no two letters sit on one line.
  var GLYPH = {
    's': ['M0.70 0.86 Q0.68 1.04 0.44 1.04 Q0.16 1.04 0.15 0.78 Q0.14 0.56 0.42 0.47 Q0.68 0.38 0.66 0.18 Q0.64 -0.01 0.34 0.01 Q0.15 0.02 0.09 0.17', 0.80],
    't': ['M0.30 1.54 L0.28 0.20 Q0.27 0.02 0.45 0.03 M0.05 1.04 L0.56 1.01', 0.64],
    'i': ['M0.22 0.98 L0.20 0.10 Q0.20 0.01 0.33 0.03 M0.225 1.28 L0.235 1.33', 0.42],
    'l': ['M0.28 1.56 L0.26 0.10 Q0.26 0.01 0.41 0.03', 0.46],
    'w': ['M0.02 1.00 L0.20 0.04 L0.42 0.70 L0.62 0.04 L0.82 1.00', 0.90],
    'a': ['M0.78 0.98 L0.76 0.06 M0.76 0.74 Q0.60 1.03 0.36 0.96 Q0.10 0.88 0.08 0.54 Q0.06 0.14 0.36 0.04 Q0.63 -0.04 0.76 0.24', 0.92],
    'r': ['M0.16 1.00 L0.14 0.04 M0.15 0.70 Q0.33 1.05 0.68 0.90', 0.68],
    'm': ['M0.10 1.00 L0.09 0.04 M0.10 0.72 Q0.18 1.04 0.32 0.72 L0.32 0.04 M0.33 0.72 Q0.42 1.04 0.55 0.72 L0.56 0.04', 0.74],
    'f': ['M0.62 1.42 Q0.52 1.62 0.38 1.42 Q0.32 1.28 0.31 1.10 L0.27 0.10 Q0.26 -0.03 0.41 0.01 M0.07 1.02 L0.58 1.00', 0.60],
    'o': ['M0.50 1.03 Q0.12 1.05 0.10 0.54 Q0.09 0.02 0.46 0.01 Q0.84 -0.01 0.86 0.50 Q0.88 1.01 0.50 1.03 M0.86 0.44 Q0.90 0.16 0.85 0.05', 0.90],
    'h': ['M0.15 1.55 L0.13 0.05 M0.14 0.70 Q0.30 1.05 0.50 0.74 L0.51 0.05', 0.74],
    'u': ['M0.10 1.00 L0.09 0.28 Q0.10 0.00 0.38 0.03 Q0.61 0.06 0.62 0.30 L0.63 1.00 M0.63 0.17 Q0.66 0.01 0.79 0.04', 0.88],
    'j': ['M0.38 0.99 L0.34 -0.22 Q0.32 -0.45 0.11 -0.36 M0.375 1.28 L0.385 1.33', 0.50],
    'd': ['M0.76 1.53 L0.74 0.06 M0.74 0.74 Q0.58 1.03 0.34 0.96 Q0.08 0.88 0.06 0.54 Q0.05 0.14 0.34 0.04 Q0.61 -0.04 0.74 0.24', 0.92],
    'g': ['M0.76 0.98 L0.74 0.06 M0.74 0.74 Q0.58 1.03 0.34 0.96 Q0.08 0.88 0.06 0.54 Q0.05 0.14 0.34 0.04 Q0.61 -0.04 0.74 0.24 M0.74 -0.06 Q0.70 -0.43 0.40 -0.41 Q0.17 -0.40 0.13 -0.21', 0.92],
    'e': ['M0.11 0.55 L0.76 0.59 Q0.76 1.03 0.44 1.03 Q0.10 1.03 0.09 0.52 Q0.08 0.02 0.48 0.02 Q0.67 0.02 0.77 0.19', 0.86],
    ' ': [null, 0.34]
  };
  function handLine(text, x, y, size) {
    var cx = x, i, ch, gl, m, pp, rot;
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      gl = GLYPH[ch];
      if (!gl) { cx += size * 0.4; continue; }
      if (gl[0]) {
        rot = rg(-1.8, 1.8);
        m = new DOMMatrix();
        m = m.translate(cx, y + rg(-0.035, 0.035) * size);
        m = m.rotate(rot);
        m = m.skewX(-10);
        m = m.scale(size, -size);
        pp = new Path2D();
        pp.addPath(new Path2D(gl[0]), m);
        g.stroke(pp);
      }
      cx += gl[1] * size + 0.055 * size;
    }
  }

  /* ============================ 1. the room, out of focus ================= */
  function background() {
    var A = offscreen(), a = A.getContext('2d'), i, x, y, r, t, o, col, rad;

    var bg = a.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0.00, '#0f0804');
    bg.addColorStop(0.32, '#1d1008');
    bg.addColorStop(0.60, '#27150b');
    bg.addColorStop(1.00, '#120a05');
    a.fillStyle = bg; a.fillRect(0, 0, W, H);

    a.save(); a.filter = 'blur(80px)';
    var gl = a.createRadialGradient(440, 352, 20, 440, 352, 540);
    gl.addColorStop(0, 'rgba(255,182,100,0.36)');
    gl.addColorStop(0.45, 'rgba(214,112,44,0.15)');
    gl.addColorStop(1, 'rgba(70,28,8,0)');
    a.fillStyle = gl; a.fillRect(0, 0, W, H);
    a.restore();

    a.save();
    for (i = 0; i < 32; i++) {
      x = rg(-60, W + 60); y = rg(-90, 480); r = rg(14, 74); t = rnd(); o = rg(0.35, 1);
      col = t < 0.45 ? '255,190,104' : t < 0.78 ? '255,142,58' : '255,228,158';
      rad = a.createRadialGradient(x, y, 0, x, y, r);
      rad.addColorStop(0, 'rgba(' + col + ',' + (0.32 * o).toFixed(3) + ')');
      rad.addColorStop(0.55, 'rgba(' + col + ',' + (0.17 * o).toFixed(3) + ')');
      rad.addColorStop(1, 'rgba(' + col + ',0)');
      a.fillStyle = rad; a.beginPath(); a.arc(x, y, r, 0, 7); a.fill();
    }
    a.restore();

    g.save(); g.filter = 'blur(3.4px)'; g.drawImage(A, 0, 0); g.restore();
  }

  /* ============================ 2. the wooden table ======================= */
  function table() {
    var T = offscreen(), t = T.getContext('2d'), i, y, x0, len, th, light, sy;

    var g1 = t.createLinearGradient(0, 300, 0, H);
    g1.addColorStop(0.00, '#281607');
    g1.addColorStop(0.16, '#3b200e');
    g1.addColorStop(0.52, '#4a2b14');
    g1.addColorStop(0.86, '#301d0d');
    g1.addColorStop(1.00, '#201106');
    t.fillStyle = g1; t.fillRect(0, 300, W, H - 300);

    t.globalCompositeOperation = 'destination-out';
    var fd = t.createLinearGradient(0, 272, 0, 372);
    fd.addColorStop(0, 'rgba(0,0,0,1)');
    fd.addColorStop(1, 'rgba(0,0,0,0)');
    t.fillStyle = fd; t.fillRect(0, 272, W, 100);
    t.globalCompositeOperation = 'source-over';

    t.lineCap = 'round';
    for (i = 0; i < 200; i++) {
      y = 300 + Math.pow(rnd(), 0.82) * (H - 280);
      x0 = rg(-70, W * 0.62); len = rg(W * 0.35, W * 1.05);
      th = rg(0.7, 3.6); light = rnd() < 0.42;
      t.strokeStyle = light ? 'rgba(162,104,48,' + rg(0.035, 0.12).toFixed(3) + ')'
                            : 'rgba(20,9,3,' + rg(0.05, 0.20).toFixed(3) + ')';
      t.lineWidth = th;
      t.beginPath(); t.moveTo(x0, y);
      t.bezierCurveTo(x0 + len * 0.33, y + rg(-8, 8), x0 + len * 0.66, y + rg(-8, 8), x0 + len, y + rg(-6, 6));
      t.stroke();
    }
    for (i = 0; i < 9; i++) {
      y = rg(340, H);
      t.strokeStyle = 'rgba(24,11,4,' + rg(0.05, 0.13).toFixed(3) + ')';
      t.lineWidth = rg(5, 16);
      t.beginPath(); t.moveTo(rg(-50, 300), y);
      t.bezierCurveTo(rg(300, 500), y + rg(-14, 14), rg(560, 760), y + rg(-14, 14), rg(820, 1080), y + rg(-10, 10));
      t.stroke();
    }
    var seams = [430, 742];
    for (i = 0; i < seams.length; i++) {
      sy = seams[i];
      t.strokeStyle = 'rgba(10,4,1,0.58)'; t.lineWidth = 3.4;
      t.beginPath(); t.moveTo(-20, sy);
      t.bezierCurveTo(300, sy + 9, 700, sy - 7, 1044, sy + 5); t.stroke();
      t.strokeStyle = 'rgba(196,126,58,0.07)'; t.lineWidth = 1.7;
      t.beginPath(); t.moveTo(-20, sy + 3.2);
      t.bezierCurveTo(300, sy + 12, 700, sy - 4, 1044, sy + 8); t.stroke();
    }

    g.save(); g.filter = 'blur(2.5px)'; g.drawImage(T, 0, 0); g.restore();
  }

  /* ============================ 3. the plate ============================== */
  function plate() {
    var pc = PLATE, ph = 2.2, amp = 0.009, i;

    g.save();
    g.translate(pc.x, pc.y + 34);
    g.scale(1, (pc.ry + 50) / (pc.rx * 1.05));
    g.translate(-pc.x, -(pc.y + 34));
    g.filter = 'blur(26px)';
    var sh = g.createRadialGradient(pc.x, pc.y + 34, pc.rx * 0.2, pc.x, pc.y + 34, pc.rx * 1.05);
    sh.addColorStop(0, 'rgba(0,0,0,0.70)');
    sh.addColorStop(0.72, 'rgba(0,0,0,0.36)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh;
    g.beginPath(); g.arc(pc.x, pc.y + 34, pc.rx * 1.05, 0, 7); g.fill();
    g.restore();

    var outer = ring(pc.x, pc.y, pc.rx, pc.ry, ph, amp, NP);
    path(outer, true);
    var pg = g.createLinearGradient(pc.x - pc.rx * 0.85, pc.y - pc.ry * 1.5,
                                    pc.x + pc.rx * 0.85, pc.y + pc.ry * 1.5);
    pg.addColorStop(0.00, '#f1e8d6');
    pg.addColorStop(0.22, '#dbd0bb');
    pg.addColorStop(0.50, '#b3a892');
    pg.addColorStop(0.76, '#7c7263');
    pg.addColorStop(1.00, '#4b4439');
    g.fillStyle = pg; g.fill();

    var inner = ring(pc.x, pc.y + 5, pc.rx * 0.855, pc.ry * 0.835, ph + 1.3, amp * 0.8, NP);
    path(inner, true);
    var wg = g.createLinearGradient(pc.x - pc.rx * 0.6, pc.y - pc.ry, pc.x + pc.rx * 0.6, pc.y + pc.ry);
    wg.addColorStop(0.00, '#e3d8c2');
    wg.addColorStop(0.45, '#b6aa93');
    wg.addColorStop(1.00, '#7a7060');
    g.fillStyle = wg; g.fill();

    g.save(); path(inner, true); g.clip();
    g.filter = 'blur(2.6px)'; g.lineWidth = 4.5;
    g.strokeStyle = 'rgba(255,248,232,0.50)';
    arcPath(inner, 0.60, 0.92); g.stroke();
    g.strokeStyle = 'rgba(74,62,44,0.34)';
    arcPath(inner, 0.10, 0.42); g.stroke();
    g.restore();

    g.save(); path(outer, true); g.clip();
    g.filter = 'blur(3.4px)'; g.lineWidth = 10;
    g.strokeStyle = 'rgba(255,250,238,0.80)';
    arcPath(outer, 0.58, 0.90); g.stroke();
    g.filter = 'blur(4px)'; g.lineWidth = 8;
    g.strokeStyle = 'rgba(255,214,150,0.24)';
    arcPath(outer, 0.90, 1.06); g.stroke();
    g.restore();

    g.save(); path(outer, true); g.clip();
    for (i = 0; i < 1500; i++) {
      var th = rnd() * Math.PI * 2, rr = Math.sqrt(rnd());
      var px = pc.x + Math.cos(th) * pc.rx * rr * 0.99;
      var py = pc.y + Math.sin(th) * pc.ry * rr * 0.99;
      g.fillStyle = rnd() < 0.5 ? 'rgba(255,252,240,' + rg(0.03, 0.11).toFixed(3) + ')'
                                : 'rgba(96,82,60,' + rg(0.03, 0.13).toFixed(3) + ')';
      g.beginPath(); g.arc(px, py, rg(0.6, 2.0), 0, 7); g.fill();
    }
    g.restore();

    /* the stack casts its shadow to the lower right, where the key light puts it */
    g.save();
    g.filter = 'blur(32px)';
    var cs = g.createRadialGradient(574, 776, 24, 574, 776, 340);
    cs.addColorStop(0, 'rgba(46,28,10,0.62)');
    cs.addColorStop(0.6, 'rgba(40,24,8,0.30)');
    cs.addColorStop(1, 'rgba(40,24,8,0)');
    g.fillStyle = cs;
    g.beginPath(); g.ellipse(578, 780, 344, 158, 0.04, 0, 7); g.fill();
    g.restore();
  }

  /* =============== 4. the stack: band, face, crumb, contact ============== */
  function pancake(i) {
    var p = STACK[i], ph = p.ph, amp = p.amp, k, j;
    var top = ring(p.x, p.y, p.rx, p.ry, ph, amp, NP);

    /* the fluffy shoulder catches light before the face starts: a soft halo
       just outside the silhouette, which the face fill then cuts into */
    path(top, true);
    g.save();
    g.filter = 'blur(7px)'; g.lineWidth = 8;
    g.strokeStyle = 'rgba(255,224,164,0.20)';
    g.stroke();
    g.restore();

    /* ---- the browned edge ---- */
    var band = [];
    for (k = 0; k <= NP / 2; k++) band.push(top[k]);
    for (k = NP / 2; k >= 0; k--) band.push([top[k][0], top[k][1] + p.t]);
    path(band, true);
    var bgd = g.createLinearGradient(0, p.y - p.ry * 0.2, 0, p.y + p.ry + p.t);
    bgd.addColorStop(0.00, '#5d3009');
    bgd.addColorStop(0.18, '#8f5318');
    bgd.addColorStop(0.42, '#a86528');
    bgd.addColorStop(0.70, '#7d4413');
    bgd.addColorStop(1.00, '#4d2808');
    g.fillStyle = bgd; g.fill();

    g.save(); path(band, true); g.clip();
    for (k = 0; k < 140; k++) {
      var th = rg(0.02, Math.PI - 0.02), kb = wobble(th, ph, amp);
      var x = p.x + Math.cos(th) * p.rx * kb, y = p.y + Math.sin(th) * p.ry * kb;
      g.strokeStyle = rnd() < 0.5
        ? 'rgba(255,204,132,' + rg(0.04, 0.16).toFixed(3) + ')'
        : 'rgba(52,24,4,' + rg(0.06, 0.24).toFixed(3) + ')';
      g.lineWidth = rg(0.9, 4.6);
      g.beginPath(); g.moveTo(x, y + rg(-1, 5)); g.lineTo(x + rg(-3, 3), y + p.t + rg(-5, 5)); g.stroke();
    }
    for (k = 0; k < 18; k++) {
      var th2 = rg(0.05, Math.PI - 0.05), kb2 = wobble(th2, ph, amp);
      g.save();
      g.filter = 'blur(' + rg(5, 12).toFixed(0) + 'px)';
      g.fillStyle = rnd() < 0.5 ? 'rgba(58,26,4,' + rg(0.10, 0.26).toFixed(3) + ')'
                                : 'rgba(196,124,52,' + rg(0.05, 0.16).toFixed(3) + ')';
      g.beginPath();
      g.ellipse(p.x + Math.cos(th2) * p.rx * kb2, p.y + Math.sin(th2) * p.ry * kb2 + p.t * 0.5,
                rg(20, 66), p.t * rg(0.4, 0.8), 0, 0, 7);
      g.fill();
      g.restore();
    }
    g.filter = 'blur(1.6px)'; g.lineWidth = 6;
    g.strokeStyle = 'rgba(232,166,86,0.34)';
    arcPath(top, 0.0, 0.5); g.stroke();
    g.filter = 'blur(2.5px)'; g.lineWidth = 5;
    g.strokeStyle = 'rgba(70,32,4,0.46)';
    arcPath(top, 0.02, 0.48); g.stroke();
    g.filter = 'none';
    g.restore();

    /* ---- the lit face ---- */
    path(top, true);
    var fg = g.createRadialGradient(p.x - p.rx * 0.30, p.y - p.ry * 0.62, p.rx * 0.05,
                                    p.x + p.rx * 0.05, p.y + p.ry * 0.10, p.rx * 1.18);
    fg.addColorStop(0.00, '#f9d394');
    fg.addColorStop(0.26, '#e8b569');
    fg.addColorStop(0.56, '#cd9244');
    fg.addColorStop(0.80, '#a96726');
    fg.addColorStop(1.00, '#854b15');
    g.fillStyle = fg; g.fill();

    g.save(); path(top, true); g.clip();

    for (k = 0; k < 32; k++) {
      var a2 = rnd() * Math.PI * 2, r2 = Math.sqrt(rnd()) * 0.94;
      g.save();
      g.filter = 'blur(' + rg(9, 26).toFixed(0) + 'px)';
      g.fillStyle = rnd() < 0.46
        ? 'rgba(92,44,8,' + rg(0.07, 0.20).toFixed(3) + ')'
        : 'rgba(255,222,150,' + rg(0.05, 0.16).toFixed(3) + ')';
      g.beginPath();
      g.ellipse(p.x + Math.cos(a2) * p.rx * r2, p.y + Math.sin(a2) * p.ry * r2,
                rg(26, 96), rg(16, 60), rg(0, 3), 0, 7);
      g.fill();
      g.restore();
    }

    g.filter = 'blur(6px)'; g.lineWidth = 30; g.lineCap = 'round';
    g.strokeStyle = 'rgba(104,50,6,0.28)';
    arcPath(top, 0.24, 0.76); g.stroke();
    g.lineWidth = 20;
    g.strokeStyle = 'rgba(122,62,10,0.22)';
    arcPath(top, 0.80, 0.14); g.stroke();
    g.filter = 'none';

    /* crumb: bent fibres, then pores, then the real holes. At this scale a pore
       in a pancake is a good few millimetres across, so they have to be drawn
       big and dark - pores a pixel wide read as noise, not as crumb. */
    for (k = 0; k < 340; k++) {
      var t3 = rg(0, 6.2832), r4 = Math.pow(rnd(), 0.70) * 0.99;
      var fx = p.x + Math.cos(t3) * p.rx * r4, fy = p.y + Math.sin(t3) * p.ry * r4;
      var ang = rg(0, 6.2832), len = rg(9, 32);
      g.strokeStyle = rnd() < 0.5
        ? 'rgba(255,230,184,' + rg(0.04, 0.13).toFixed(3) + ')'
        : 'rgba(92,44,9,' + rg(0.05, 0.16).toFixed(3) + ')';
      g.lineWidth = rg(1.3, 3.6);
      g.beginPath(); g.moveTo(fx, fy);
      g.quadraticCurveTo(fx + Math.cos(ang) * len * 0.5 + rg(-3, 3),
                         fy + Math.sin(ang) * len * 0.5 + rg(-3, 3),
                         fx + Math.cos(ang) * len, fy + Math.sin(ang) * len);
      g.stroke();
    }
    for (k = 0; k < 260; k++) {
      var t2 = rg(0, 6.2832), r3 = Math.pow(rnd(), 0.72) * 0.99;
      var qx = p.x + Math.cos(t2) * p.rx * r3;
      var qy = p.y + Math.sin(t2) * p.ry * r3;
      var rad2 = rg(3.6, 13.0), roll = rnd();
      if (roll < 0.22) {
        g.fillStyle = 'rgba(255,232,186,' + rg(0.08, 0.24).toFixed(3) + ')';
        g.beginPath(); g.arc(qx - rad2 * 0.30, qy - rad2 * 0.34, rad2, 0, 7); g.fill();
        g.fillStyle = 'rgba(84,40,7,' + rg(0.12, 0.30).toFixed(3) + ')';
        g.beginPath(); g.arc(qx + rad2 * 0.34, qy + rad2 * 0.40, rad2 * 0.82, 0, 7); g.fill();
      } else if (roll < 0.84) {
        g.filter = rnd() < 0.35 ? 'blur(1.2px)' : 'none';
        g.fillStyle = 'rgba(80,36,6,' + rg(0.18, 0.46).toFixed(3) + ')';
        g.beginPath(); g.arc(qx, qy, rad2 * 0.60, 0, 7); g.fill();
      } else {
        g.filter = 'blur(1.8px)';
        g.fillStyle = 'rgba(44,18,2,' + rg(0.26, 0.52).toFixed(3) + ')';
        g.beginPath(); g.arc(qx, qy, rad2 * 0.80, 0, 7); g.fill();
      }
    }
    // and the real holes: a few, big and soft, where the crumb opened
    for (k = 0; k < 26; k++) {
      var t4 = rg(0, 6.2832), r5 = Math.pow(rnd(), 0.8) * 0.94;
      var hx2 = p.x + Math.cos(t4) * p.rx * r5, hy2 = p.y + Math.sin(t4) * p.ry * r5;
      g.save();
      g.filter = 'blur(2.6px)';
      g.fillStyle = 'rgba(44,16,2,0.42)';
      g.beginPath(); g.ellipse(hx2, hy2, rg(5, 14), rg(3.5, 9), rg(0, 3), 0, 7); g.fill();
      g.restore();
      g.fillStyle = 'rgba(255,224,168,0.16)';
      g.beginPath(); g.ellipse(hx2 - 1, hy2 - 3, rg(4, 12), rg(3, 7), rg(0, 3), 0, 7); g.fill();
    }
    g.filter = 'none';

    g.filter = 'blur(12px)'; g.lineWidth = 40;
    g.strokeStyle = 'rgba(70,32,4,0.36)';
    arcPath(top, 0.06, 0.44); g.stroke();
    g.lineWidth = 30;
    g.strokeStyle = 'rgba(255,238,200,0.30)';
    arcPath(top, 0.56, 0.94); g.stroke();
    g.filter = 'none';

    g.globalCompositeOperation = 'screen';
    var sg = g.createRadialGradient(p.x - p.rx * 0.46, p.y - p.ry * 0.92, 4,
                                    p.x - p.rx * 0.18, p.y - p.ry * 0.25, p.rx * 0.9);
    sg.addColorStop(0, 'rgba(255,228,176,0.16)');
    sg.addColorStop(1, 'rgba(255,206,132,0)');
    g.fillStyle = sg; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
    g.restore();

    /* ---- the shadow it drops on the pancake below, and the crease ---- */
    if (STACK[i - 1]) {
      var cpts = [];
      for (j = 0; j <= NP / 2; j++) cpts.push([top[j][0], top[j][1] + p.t * 0.55]);
      for (j = NP / 2; j >= 0; j--) cpts.push([top[j][0], top[j][1] + p.t + 28]);
      path(cpts, true);
      g.save();
      g.filter = 'blur(8px)';
      g.fillStyle = 'rgba(22,9,2,0.72)';
      g.fill();
      g.restore();

      var crease = [];
      for (j = 0; j <= NP / 2; j++) crease.push([top[j][0], top[j][1] + p.t]);
      path(crease, false);
      g.save();
      g.filter = 'blur(2.5px)'; g.lineWidth = 7;
      g.strokeStyle = 'rgba(30,12,2,0.50)';
      g.stroke();
      g.restore();
    }
  }

  /* ============================ 5. the syrup ============================== */
  // Real syrup is translucent: you can see the food through it, and it darkens
  // what is under it rather than hiding it. So each run is laid on below full
  // opacity and then deepened with a multiply pass, and the highlights are
  // broken into pieces - a single bright line running the whole length of a run
  // is exactly what makes drawn syrup look like a wax rod.
  function run(pts, hw, opt) {
    opt = opt || {};
    var poly = ribbon(pts, hw);
    var y0 = pts[0][1], y1 = pts[pts.length - 1][1], i;

    g.save();
    path(poly, true);
    g.filter = 'blur(9px)';
    g.fillStyle = 'rgba(224,122,26,0.24)';
    g.fill();
    g.filter = 'none';

    var lg = g.createLinearGradient(0, y0 - 10, 0, y1 + 10);
    lg.addColorStop(0.00, opt.top || '#b95f12');
    lg.addColorStop(0.22, '#d47a1b');
    lg.addColorStop(0.50, '#f0a63c');
    lg.addColorStop(0.76, '#d8801d');
    lg.addColorStop(1.00, opt.bot || '#ab5a12');
    g.globalAlpha = 0.88;
    g.fillStyle = lg; g.fill();
    g.globalAlpha = 1;

    // deepen the body without hiding the crumb underneath
    g.globalCompositeOperation = 'multiply';
    var mg = g.createLinearGradient(0, y0, 0, y1);
    mg.addColorStop(0.00, 'rgba(96,38,4,0.46)');
    mg.addColorStop(0.40, 'rgba(146,74,12,0.16)');
    mg.addColorStop(1.00, 'rgba(96,38,4,0.42)');
    g.fillStyle = mg; g.fill();
    for (i = 0; i < 5; i++) {
      var o2 = rg(-0.66, 0.66);
      path(offsetLine(pts, o2 * hw[0], 0, pts.length - 1, 3.4), false);
      g.strokeStyle = 'rgba(112,50,4,' + rg(0.10, 0.26).toFixed(3) + ')';
      g.lineWidth = rg(4, 12); g.lineCap = 'round'; g.stroke();
    }
    g.globalCompositeOperation = 'source-over';

    g.save(); g.clip();
    for (i = 0; i < 10; i++) {
      var o = rg(-0.86, 0.86);
      path(offsetLine(pts, o * hw[0], 0, pts.length - 1, 2.5), false);
      g.strokeStyle = rnd() < 0.5 ? 'rgba(118,54,6,' + rg(0.08, 0.20).toFixed(3) + ')'
                                  : 'rgba(255,196,110,' + rg(0.06, 0.18).toFixed(3) + ')';
      g.lineWidth = rg(1, 3.4); g.stroke();
    }
    g.restore();

    // the thin lower edge, where light comes through the film
    path(offsetLine(pts, hw[0] * 0.90, 1, pts.length - 2, 3), false);
    g.globalCompositeOperation = 'screen';
    g.strokeStyle = 'rgba(255,178,86,0.40)'; g.lineWidth = 5;
    g.filter = 'blur(3.4px)'; g.stroke();
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';

    path(poly, true);
    g.strokeStyle = 'rgba(100,46,4,0.36)'; g.lineWidth = 2.2;
    g.filter = 'blur(1.6px)'; g.stroke(); g.filter = 'none';

    g.globalCompositeOperation = 'screen';
    path(offsetLine(pts, -hw[0] * 0.32, 1, pts.length - 2, 4), false);
    g.strokeStyle = 'rgba(255,222,166,0.30)'; g.lineWidth = 7;
    g.filter = 'blur(4px)'; g.stroke();
    g.filter = 'blur(0.8px)';
    var seg = Math.max(2, Math.floor((pts.length - 4) / 3));
    for (i = 0; i < 3; i++) {
      var f0 = 1 + i * seg;
      var f1 = Math.min(pts.length - 2, f0 + seg);
      if (f1 <= f0) continue;
      path(offsetLine(pts, -hw[0] * (0.38 + rg(-0.14, 0.14)), f0, f1, 1.6), false);
      g.strokeStyle = 'rgba(255,248,228,' + rg(0.45, 0.78).toFixed(2) + ')';
      g.lineWidth = rg(1.2, 2.3); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    g.restore();
  }

  // a drip: a neck that narrows, a bead, then the specular that stops it
  // looking like a painted drop
  function drip(x, yTop, yBulb, r, w0, thin) {
    var mid = (yTop + yBulb) / 2, dg;
    g.beginPath();
    g.moveTo(x - w0, yTop);
    g.lineTo(x + w0, yTop);
    g.quadraticCurveTo(x + (thin ? w0 * 1.1 : w0 * 3.2), mid, x + r * (thin ? 0.42 : 0.72), yBulb - r * 0.30);
    g.lineTo(x - r * (thin ? 0.42 : 0.72), yBulb - r * 0.30);
    g.quadraticCurveTo(x - (thin ? w0 * 1.1 : w0 * 3.2), mid, x - w0, yTop);
    g.closePath();
    dg = g.createLinearGradient(x - r, yTop, x + r, yBulb + r);
    dg.addColorStop(0, '#d3841f'); dg.addColorStop(0.5, '#eaa63c'); dg.addColorStop(1, '#9c4d0d');
    g.fillStyle = dg; g.fill();
    g.beginPath(); g.arc(x, yBulb, r, 0, 7); g.fill();

    g.save();
    g.globalCompositeOperation = 'screen';
    var sg = g.createRadialGradient(x - r * 0.4, yBulb - r * 0.45, 1, x - r * 0.3, yBulb - r * 0.3, r * 0.95);
    sg.addColorStop(0, 'rgba(255,252,240,0.88)');
    sg.addColorStop(0.35, 'rgba(255,224,168,0.30)');
    sg.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = sg;
    g.beginPath(); g.arc(x, yBulb, r * 1.05, 0, 7); g.fill();
    g.restore();
  }

  function syrup() {
    var i, k;

    /* ---- the sheet on the top pancake: poured from the upper left, its edge
       running across the face and spilling over the front rim ---- */
    g.save(); path(ring(TOP.x, TOP.y, TOP.rx, TOP.ry, TOP.ph, TOP.amp, NP), true); g.clip();
    var sheet = blob(452, 478, 118, 1.9, 0.24, 200);
    for (i = 0; i < sheet.length; i++) {
      sheet[i][0] = 452 + (sheet[i][0] - 452) * 1.15;
      sheet[i][1] = 478 + (sheet[i][1] - 478) * 0.52;
    }
    path(sheet, true);
    g.filter = 'blur(10px)'; g.fillStyle = 'rgba(214,116,22,0.20)'; g.fill();
    g.filter = 'none';
    var pg = g.createRadialGradient(424, 448, 10, 496, 490, 180);
    pg.addColorStop(0.00, '#9c4e11');
    pg.addColorStop(0.40, '#bd691c');
    pg.addColorStop(0.72, '#de8f28');
    pg.addColorStop(1.00, '#c47c22');
    g.globalAlpha = 0.86;
    g.fillStyle = pg; g.fill();
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = 'rgba(140,68,10,0.26)';
    g.fill();
    g.globalCompositeOperation = 'source-over';
    g.save(); g.clip();
    for (i = 0; i < 18; i++) {
      var a = rg(0, 6.28), rr = Math.sqrt(rnd()) * 76;
      g.strokeStyle = rnd() < 0.5 ? 'rgba(118,54,6,0.15)' : 'rgba(255,196,110,0.12)';
      g.lineWidth = rg(1, 3);
      g.beginPath();
      g.arc(456 + Math.cos(a) * rr, 470 + Math.sin(a) * rr * 0.55, rg(8, 36), a, a + rg(0.6, 2.6));
      g.stroke();
    }
    g.globalCompositeOperation = 'screen';
    var hs = g.createRadialGradient(404, 450, 1, 404, 450, 56);
    hs.addColorStop(0, 'rgba(255,250,236,0.58)');
    hs.addColorStop(0.4, 'rgba(255,214,150,0.18)');
    hs.addColorStop(1, 'rgba(255,190,110,0)');
    g.fillStyle = hs; g.beginPath(); g.ellipse(404, 450, 56, 28, -0.3, 0, 7); g.fill();
    g.globalCompositeOperation = 'source-over';
    g.restore(); g.restore();

    /* ---- the cascade. Syrup clings to the food: it is one body of liquid
       lying on the stack, not three separate streams. It is built as a single
       region bounded by the silhouette of the stack, with a wavy trailing edge
       and a ridge at every step it flows over, and only a few narrow tongues
       carry on below the edge. Three parallel ribbons of constant width down
       the front is exactly what makes drawn syrup look extruded. ---- */
    var lim = [], NB = 170, yA = 396, yB = 744, j, yc, lo, hi, d1, d2, dx1, dx2, q;
    for (i = 0; i <= NB; i++) {
      yc = yA + (yB - yA) * i / NB;
      lo = 1e9; hi = -1e9;
      for (j = 0; j < STACK.length; j++) {
        q = STACK[j];
        d1 = (yc - (q.y + q.t / 2)) / (q.ry + q.t / 2);
        if (d1 > -1 && d1 < 1) {
          dx1 = Math.sqrt(1 - d1 * d1) * q.rx;
          if (q.x - dx1 < lo) lo = q.x - dx1;
          if (q.x + dx1 > hi) hi = q.x + dx1;
        }
        d2 = (yc - q.y) / q.ry;
        if (d2 > -1 && d2 < 1) {
          dx2 = Math.sqrt(1 - d2 * d2) * q.rx;
          if (q.x - dx2 < lo) lo = q.x - dx2;
          if (q.x + dx2 > hi) hi = q.x + dx2;
        }
      }
      lim.push([yc, lo, hi]);
    }
    function limAt(y) {
      var t = (y - yA) / (yB - yA) * NB, idx = Math.max(0, Math.min(NB - 1, Math.floor(t))), f = t - idx;
      return [lim[idx][1] + (lim[idx + 1][1] - lim[idx][1]) * f,
              lim[idx][2] + (lim[idx + 1][2] - lim[idx][2]) * f];
    }

    // the trailing edge: a wave that runs deeper on the left, where it poured
    var NE = 110, edge = [], coatt = [];
    for (i = 0; i <= NE; i++) {
      coatt.push(i / NE);
      edge.push(690
        + 30 * Math.sin(i / NE * 5.7 + 0.4)
        + 16 * Math.sin(i / NE * 11.3 + 2.2)
        + 9 * Math.sin(i / NE * 19.7 + 1.1)
        + 34 * Math.pow(1 - i / NE, 2));
    }
    // in from the silhouette, so the browned edges of the stack stay visible
    function coatX(t, y) {
      var L = limAt(y), f = 0.03 + 0.15 * Math.min(1, Math.max(0, (y - 440) / 300));
      return L[0] + (L[1] - L[0]) * (f + (1 - 2 * f) * t);
    }
    var coat = [], yTopCoat = 470;
    for (i = 0; i <= 28; i++) {
      var yy = yTopCoat + (edge[0] - yTopCoat) * i / 28;
      coat.push([coatX(0.02 * (i / 28), yy), yy]);
    }
    for (i = 0; i <= NE; i++) coat.push([coatX(coatt[i], edge[i]), edge[i]]);
    for (i = 28; i >= 0; i--) {
      var yy2 = yTopCoat + (edge[NE] - yTopCoat) * i / 28;
      coat.push([coatX(1 - 0.02 * (i / 28), yy2), yy2]);
    }
    // the pancake just past the edge has soaked: a damp, slightly darker and
    // glossier zone outside the liquid, so the boundary is not a hard cut
    // between shiny syrup and dry crumb
    path(coat, true);
    g.save();
    g.filter = 'blur(10px)'; g.lineWidth = 18;
    g.strokeStyle = 'rgba(146,74,16,0.34)'; g.stroke();
    g.filter = 'blur(6px)'; g.lineWidth = 8;
    g.globalCompositeOperation = 'screen';
    g.strokeStyle = 'rgba(228,150,56,0.30)'; g.stroke();
    g.globalCompositeOperation = 'source-over';
    g.restore();

    path(coat, true);
    g.fillStyle = 'rgba(220,130,34,0.22)';
    g.filter = 'blur(11px)'; g.fill(); g.filter = 'none';
    var coatG = g.createLinearGradient(0, 452, 0, 756);
    coatG.addColorStop(0.00, 'rgba(196,110,28,0.00)');
    coatG.addColorStop(0.10, 'rgba(206,118,30,0.52)');
    coatG.addColorStop(0.34, 'rgba(230,142,42,0.88)');
    coatG.addColorStop(0.70, 'rgba(222,134,38,0.86)');
    coatG.addColorStop(0.88, 'rgba(206,122,30,0.78)');
    coatG.addColorStop(1.00, 'rgba(188,104,26,0.68)');
    path(coat, true);
    g.fillStyle = coatG; g.fill();
    g.save(); path(coat, true); g.clip();
    g.globalCompositeOperation = 'multiply';
    var cm = g.createLinearGradient(0, 430, 0, 748);
    cm.addColorStop(0.00, 'rgba(120,52,6,0.06)');
    cm.addColorStop(0.45, 'rgba(150,78,14,0.20)');
    cm.addColorStop(1.00, 'rgba(108,44,4,0.34)');
    g.fillStyle = cm; g.fillRect(0, 400, W, 360);
    g.globalCompositeOperation = 'source-over';

    // the syrup runs in lines down the face, and gathers at every step
    for (i = 0; i < 26; i++) {
      var sx = rg(240, 790), sy = rg(470, 720), ln = rg(40, 130);
      g.strokeStyle = rnd() < 0.5 ? 'rgba(120,54,6,' + rg(0.06, 0.16).toFixed(3) + ')'
                                  : 'rgba(255,198,116,' + rg(0.05, 0.15).toFixed(3) + ')';
      g.lineWidth = rg(1.6, 5.4);
      g.beginPath(); g.moveTo(sx, sy);
      g.quadraticCurveTo(sx + rg(-9, 9), sy + ln * 0.5, sx + rg(-14, 14), sy + ln);
      g.stroke();
    }
    // suspended bubbles: real syrup is never optically clean, and they are what
    // tells the eye a surface is thick rather than painted on
    for (i = 0; i < 230; i++) {
      var bx2 = rg(250, 790), by2 = rg(452, 748), br2 = rg(0.7, 2.7);
      g.fillStyle = rnd() < 0.55
        ? 'rgba(255,226,168,' + rg(0.10, 0.32).toFixed(3) + ')'
        : 'rgba(118,50,4,' + rg(0.08, 0.22).toFixed(3) + ')';
      g.beginPath(); g.arc(bx2, by2, br2, 0, 7); g.fill();
    }
    for (i = 1; i < STACK.length; i++) {
      var sp2 = ring(STACK[i].x, STACK[i].y, STACK[i].rx, STACK[i].ry, STACK[i].ph, STACK[i].amp, NP);
      g.globalCompositeOperation = 'screen';
      g.filter = 'blur(4px)'; g.lineWidth = 9;
      g.strokeStyle = 'rgba(255,216,152,0.34)';
      path(offsetPts(sp2, 0, NP / 2, 0, 0), false); g.stroke();
      g.filter = 'none';
      g.globalCompositeOperation = 'source-over';
      g.filter = 'blur(3px)'; g.lineWidth = 5;
      g.strokeStyle = 'rgba(118,52,6,0.30)';
      path(offsetPts(sp2, 0, NP / 2, 0, 7), false); g.stroke();
      g.filter = 'none';
    }
    // a broad sheen and a few broken speculars: liquid, not varnish
    g.globalCompositeOperation = 'screen';
    var cg2 = g.createLinearGradient(300, 480, 260, 740);
    cg2.addColorStop(0, 'rgba(255,224,168,0.20)');
    cg2.addColorStop(1, 'rgba(255,196,124,0.06)');
    g.fillStyle = cg2; g.fillRect(0, 400, W, 380);
    g.filter = 'blur(2.2px)';
    for (i = 0; i < 14; i++) {
      var hx = rg(270, 760), hy = rg(486, 700), hl = rg(26, 96);
      path([[hx, hy], [hx + rg(-8, 8), hy + hl * 0.5], [hx + rg(-12, 12), hy + hl]], false);
      g.strokeStyle = 'rgba(255,250,234,' + rg(0.18, 0.46).toFixed(2) + ')';
      g.lineWidth = rg(1.4, 3.6); g.stroke();
    }
    g.filter = 'none';
    g.globalCompositeOperation = 'source-over';
    g.restore();

    // the trailing edge of the liquid: dark where it ends, bright where the
    // film thins out and light comes through it
    var rimPts = [];
    for (i = 0; i <= NE; i++) rimPts.push([coatX(coatt[i], edge[i]), edge[i]]);
    path(rimPts, false);
    g.filter = 'blur(2.2px)'; g.lineWidth = 4;
    g.strokeStyle = 'rgba(104,44,4,0.44)'; g.stroke();
    g.globalCompositeOperation = 'screen';
    g.filter = 'blur(3px)'; g.lineWidth = 3;
    g.strokeStyle = 'rgba(255,186,92,0.46)';
    path(offsetPts(rimPts, 0, NE, 0, 3), false); g.stroke();
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';

    /* ---- narrow tongues carrying on below the edge, down to the puddle ---- */
    var runs = [
      { p: [[coatX(coatt[14], edge[14]), edge[14]], [404, edge[14] + 30], [394, edge[14] + 72]],
        w: [26, 21, 15] },
      { p: [[coatX(coatt[46], edge[46]), edge[46]], [492, edge[46] + 34], [486, edge[46] + 76]],
        w: [34, 27, 17] },

    g.strokeStyle = 'rgba(140,112,74,0.15)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(-CW / 2 + 12, 4); g.lineTo(CW / 2 - 8, 1); g.stroke();
    g.beginPath(); g.moveTo(-CW / 2 + 12, 36); g.lineTo(CW / 2 - 8, 33); g.stroke();
    g.globalCompositeOperation = 'screen';
    var eg = g.createLinearGradient(-CW / 2, -CH / 2, -CW / 2, CH / 2);
    eg.addColorStop(0, 'rgba(255,240,210,0.26)');
    eg.addColorStop(1, 'rgba(255,230,190,0)');
    g.fillStyle = eg; g.fillRect(-CW / 2, -CH / 2, CW, CH);
    g.globalCompositeOperation = 'source-over';
    g.restore();

    g.strokeStyle = 'rgba(96,78,52,0.24)'; g.lineWidth = 1.1;
    g.strokeRect(-CW / 2, -CH / 2, CW, CH);

    // sized so both lines finish inside the card
    g.strokeStyle = 'rgba(66,50,30,0.82)';
    g.lineWidth = 2.1; g.lineCap = 'round'; g.lineJoin = 'round';
    handLine('still warm', -CW / 2 + 14, 2, 16);
    handLine('for the judge', -CW / 2 + 16, 34, 12.8);
    g.restore();
  }

  /* ============================ 10. the finish =========================== */
  function bloom() {
    var A = offscreen(), a = A.getContext('2d');
    a.drawImage(cv, 0, 0);
    a.globalCompositeOperation = 'multiply';   // squared: only the brights survive
    a.drawImage(cv, 0, 0);
    a.globalCompositeOperation = 'source-over';
    g.save();
    g.globalCompositeOperation = 'screen';
    g.globalAlpha = 0.20;
    g.filter = 'blur(26px)';
    g.drawImage(A, 0, 0);
    g.restore();
  }

  // grain and the grade in one pass over the pixels: film grain lives in the
  // shadows, and a photograph has a little more contrast and a highlight that
  // rolls off instead of stopping dead at white
  function finish() {
    var id = g.getImageData(0, 0, W, H), d = id.data, i, r, gr, b, n, lum, k;
    for (i = 0; i < d.length; i += 4) {
      r = d[i]; gr = d[i + 1]; b = d[i + 2];
      n = (rnd() - 0.5) * 13;
      lum = (r * 0.299 + gr * 0.587 + b * 0.114) / 255;
      k = 1.35 - 0.75 * lum;
      r += n * k; gr += n * k * 0.96; b += n * k * 1.06;
      // contrast, then saturation around the new luminance
      r = 128 + (r - 128) * 1.07; gr = 128 + (gr - 128) * 1.07; b = 128 + (b - 128) * 1.07;
      lum = 0.299 * r + 0.587 * gr + 0.114 * b;
      r = lum + (r - lum) * 1.11; gr = lum + (gr - lum) * 1.11; b = lum + (b - lum) * 1.11;
      // highlights roll off, shadows pick up a little warmth
      if (r > 205) r = 205 + (r - 205) * 0.80;
      if (gr > 205) gr = 205 + (gr - 205) * 0.80;
      if (b > 205) b = 205 + (b - 205) * 0.80;
      var lift = (1 - lum / 255) * 3.5;
      d[i] = clamp(r + lift); d[i + 1] = clamp(gr + lift * 0.7); d[i + 2] = clamp(b + lift * 0.3);
    }
    g.putImageData(id, 0, 0);
  }

  function vignette() {
    g.save();
    var v = g.createRadialGradient(W * 0.48, H * 0.44, H * 0.22, W * 0.5, H * 0.5, H * 0.86);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.6, 'rgba(0,0,0,0.12)');
    v.addColorStop(1, 'rgba(0,0,0,0.46)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'screen';
    var w = g.createRadialGradient(W * 0.5, H * 0.62, H * 0.1, W * 0.5, H * 0.6, H * 0.8);
    w.addColorStop(0, 'rgba(60,26,8,0.10)');
    w.addColorStop(1, 'rgba(40,16,4,0)');
    g.fillStyle = w; g.fillRect(0, 0, W, H);
    g.restore();
  }

  /* ================================ draw ================================ */
  seed(20261115);
  background();
  table();
  plate();
  for (var i = 0; i < STACK.length; i++) pancake(i);
  syrup();
  butter();
  berries();
  steam();
  note();
  bloom();
  finish();
  vignette();

  window.__drawn = true;
})();
